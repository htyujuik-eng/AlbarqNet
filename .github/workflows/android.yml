
name: Build Albarq Net APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir appsrc
          unzip -o AlbarqNet.zip -d appsrc
      - name: Fix Java version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("appsrc").rglob("build.gradle.kts"))
          for p in files:
              s = p.read_text()
              s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              s = s.replace('jvmTarget = "17"', 'jvmTarget = "1.8"')
              p.write_text(s)
              print("Updated:", p)
          PY
          
      - name: Build APK
        working-directory: appsrc
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlbarqNet-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
