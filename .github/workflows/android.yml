name: Build Albarq Net APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: |
          mkdir appsrc
          unzip -o AlbarqNet.zip -d appsrc
      - name: Add MikroTik API connection
        run: |
          cat > appsrc/app/src/main/java/com/albarqnet/app/MainActivity.kt <<'KOTLIN'
          package com.albarqnet.app
          
          import android.os.Bundle
          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec
          import java.security.KeyStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Router
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Menu
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material.icons.filled.Assessment
          import androidx.compose.material.icons.filled.Devices
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.Storage
          import androidx.compose.material.icons.filled.Info
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.io.BufferedInputStream
          import java.io.BufferedOutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import com.jcraft.jsch.JSch
          import com.jcraft.jsch.ChannelExec
          import java.util.Properties
          
          private val Navy = Color(0xFF071629)
          private val Panel = Color(0xFF102B45)
          private val Cyan = Color(0xFF45D5F5)
          private val Muted = Color(0xFF9CB2C8)
          
          data class ActiveHotspotUser(val id: String, val name: String, val address: String, val mac: String, val uptime: String)
          data class HotspotHost(val address:String,val mac:String,val server:String,val uptime:String,val interfaceName:String,val deviceName:String="غير معروف")
          
          data class RouterEntry(
              val name: String, val host: String, val port: String,
              val username: String, val password: String,
              var status: String = "غير متصل",
              var identity: String = "—", var cpu: String = "—",
              var memory: String = "—", var storage: String = "—", var uptime: String = "—",
              var activeUsers: String = "—", var lastError: String = "",
              var uploadRate: String = "غير متاح", var downloadRate: String = "غير متاح"
          ) {
              var activeSessions by mutableStateOf<List<ActiveHotspotUser>>(emptyList())
              var hostEntries by mutableStateOf<List<HotspotHost>>(emptyList())
          }
          
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { AlbarqApp() }
              }
          }
          
          @Composable
          fun AlbarqApp() {
              val context = androidx.compose.ui.platform.LocalContext.current
              val storage = remember { RouterStorage(context) }
              val routers = remember { mutableStateListOf<RouterEntry>().apply { addAll(storage.load()) } }
              var showAdd by remember { mutableStateOf(false) }
              var busy by remember { mutableStateOf(false) }
              var liveSync by remember { mutableStateOf(false) }
              var message by remember { mutableStateOf("أضف الراوتر للبدء") }
              var selectedRouter by remember { mutableStateOf<RouterEntry?>(null) }
              var usersLoading by remember { mutableStateOf(false) }
              var showOpenWrt by remember { mutableStateOf(false) }
              var showSettings by remember { mutableStateOf(false) }
              var showReports by remember { mutableStateOf(false) }
              var showRouters by remember { mutableStateOf(false) }
              var tab by remember { mutableStateOf("الرئيسية") }
              val scope = rememberCoroutineScope()
              val totalActive = routers.sumOf { it.activeUsers.toIntOrNull() ?: 0 }
              val totalHosts = routers.sumOf { it.hostEntries.size }
              val onlineRouters = routers.count { it.status == "متصل" }

              suspend fun refreshAll() {
                  if (busy || routers.isEmpty()) return
                  busy = true
                  try {
                      routers.toList().forEach { router ->
                          val result = withContext(Dispatchers.IO) {
                              runCatching {
                                  val api = RouterOsApiClient()
                                  val portNumber = router.port.toInt()
                                  val status = api.readStatus(router.host, portNumber, router.username, router.password)
                                  val hosts = api.readHosts(router.host, portNumber, router.username, router.password)
                                  val active = api.readActiveUsers(router.host, portNumber, router.username, router.password)
                                  val traffic = api.readTraffic(router.host, portNumber, router.username, router.password)
                                  Triple(status, hosts to active, traffic)
                              }
                          }
                          result.onSuccess { data ->
                              router.status = "متصل"
                              router.identity = data.first["identity"] ?: "—"
                              router.cpu = data.first["cpu"] ?: "—"
                              router.memory = data.first["memory"] ?: "—"
                              router.storage = data.first["storage"] ?: "—"
                              router.uptime = data.first["uptime"] ?: "—"
                              router.activeUsers = data.first["active"] ?: "0"
                              router.hostEntries = data.second.first
                              router.activeSessions = data.second.second
                              router.uploadRate = data.third["upload"] ?: "غير متاح"
                              router.downloadRate = data.third["download"] ?: "غير متاح"
                              router.lastError = ""
                          }.onFailure {
                              router.status = "فشل الاتصال"
                              router.lastError = it.message ?: "تعذر الاتصال"
                          }
                      }
                      message = "تم تحديث البيانات"
                  } finally {
                      busy = false
                  }
              }

              LaunchedEffect(liveSync) {
                  while (liveSync) {
                      refreshAll()
                      delay(3000)
                  }
              }
          
              MaterialTheme(colorScheme = darkColorScheme(primary = Color(0xFF7665F5), background = Color(0xFF090914), surface = Color(0xFF182341), onSurface = Color.White)) {
                  Scaffold(
                      containerColor = Color(0xFF090914),
                      floatingActionButton = {
                          FloatingActionButton(onClick = { showAdd = true }, containerColor = Color(0xFF7665F5), contentColor = Color.White) {
                              Icon(Icons.Default.Add, contentDescription = "إضافة راوتر")
                          }
                      },
                      bottomBar = {
                          NavigationBar(containerColor = Color(0xFF19192D), contentColor = Color.White) {
                              listOf("الإعدادات", "التقارير", "الراوترات", "الرئيسية").forEach { item ->
                                  NavigationBarItem(selected = tab == item, onClick = {
                                      tab = item
                                      when(item) {
                                          "الإعدادات" -> showSettings = true
                                          "التقارير" -> showReports = true
                                          "الراوترات" -> showRouters = true
                                      }
                                  },
                                      icon = { Icon(when(item) {
                                          "الإعدادات" -> Icons.Default.Settings
                                          "التقارير" -> Icons.Default.Assessment
                                          "الراوترات" -> Icons.Default.Router
                                          else -> Icons.Default.Home
                                      }, contentDescription = item) },
                                      label = { Text(item, fontSize = 10.sp) })
                              }
                          }
                      }
                  ) { padding ->
                      LazyColumn(
                          modifier = Modifier.fillMaxSize().padding(padding),
                          contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 18.dp, bottom = 20.dp),
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          item {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Surface(color = Color(0xFF22223A), shape = RoundedCornerShape(18.dp)) {
                                      IconButton(onClick = { showRouters = true; tab = "الراوترات" }) {
                                      Icon(Icons.Default.Menu, contentDescription = "قائمة الراوترات", tint = Color.White, modifier = Modifier.padding(horizontal = 12.dp).size(26.dp))
                                  }
                                  }
                                  Spacer(Modifier.weight(1f))
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text("البرق نت", color = Color.White, fontSize = 25.sp, fontWeight = FontWeight.Bold)
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text("MikroTik", color = Muted, fontSize = 13.sp)
                                          Spacer(Modifier.width(5.dp))
                                          Text("●", color = if (onlineRouters > 0) Color(0xFF55C978) else Muted, fontSize = 12.sp)
                                      }
                                  }
                                  Spacer(Modifier.width(12.dp))
                                  Surface(color = Color(0xFF22223A), shape = RoundedCornerShape(18.dp)) {
                                      IconButton(onClick = { showSettings = true; tab = "الإعدادات" }) {
                                      Icon(Icons.Default.Settings, contentDescription = "فتح الإعدادات", tint = Color(0xFF7665F5), modifier = Modifier.padding(12.dp).size(24.dp))
                                  }
                                  }
                              }
                          }
                          item {
                              Surface(color = Color(0xFF7162F2), shape = RoundedCornerShape(26.dp), modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(20.dp)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Icon(Icons.Default.Router, contentDescription = null, tint = Color.White, modifier = Modifier.size(36.dp))
                                          Spacer(Modifier.weight(1f))
                                          Column(horizontalAlignment = Alignment.End) {
                                              Text("مرحباً بك في", color = Color.White.copy(alpha = .8f), fontSize = 14.sp)
                                              Text("البرق نت", color = Color.White, fontSize = 25.sp, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                      Spacer(Modifier.height(14.dp))
                                      Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                          Text("الراوترات المتصلة: $onlineRouters", color = Color.White, fontSize = 12.sp)
                                          Text("وضع المراقبة — قراءة فقط", color = Color.White, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                          item {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("موارد النظام", color = Color.White, fontSize = 21.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.weight(1f))
                                  TextButton(onClick = { liveSync = !liveSync }) {
                                      Text(if (liveSync) "■ إيقاف" else "▶ مباشر", color = if (liveSync) Color(0xFFFF7777) else Color(0xFF55C978))
                                  }
                  }
                              Surface(color = Color(0xFF182341), shape = RoundedCornerShape(24.dp), modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                          ResourceTile("CPU", routers.firstOrNull { it.status == "متصل" }?.cpu ?: "—", Color(0xFF7665F5), Modifier.weight(1f))
                                          ResourceTile("RAM", routers.firstOrNull { it.status == "متصل" }?.memory ?: "—", Color(0xFF55B86A), Modifier.weight(1f))
                                          ResourceTile("التخزين", routers.firstOrNull { it.status == "متصل" }?.storage ?: "—", Color(0xFFFFA21A), Modifier.weight(1f))
                                      }
                                      Divider(color = Muted.copy(alpha = .35f))
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text("مدة التشغيل", color = Muted)
                                          Spacer(Modifier.weight(1f))
                                          Text(routers.firstOrNull { it.status == "متصل" }?.uptime ?: "—", color = Color.White, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          }
                          item {
                              Surface(color = Color(0xFF182341), shape = RoundedCornerShape(24.dp), modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(16.dp)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text("حركة البيانات", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                          Spacer(Modifier.weight(1f))
                                          Text("↕", color = Color(0xFF39A9F5), fontSize = 25.sp)
                                      }
                                      Spacer(Modifier.height(12.dp))
                                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                          TrafficTile("رفع", routers.firstOrNull { it.status == "متصل" }?.uploadRate ?: "غير متاح", Color(0xFF19365B), Color(0xFF39A9F5), Modifier.weight(1f))
                                          TrafficTile("تحميل", routers.firstOrNull { it.status == "متصل" }?.downloadRate ?: "غير متاح", Color(0xFF1B383B), Color(0xFF55B86A), Modifier.weight(1f))
                                      }
                                      Text("القراءة المباشرة من ether1: RX تحميل الإنترنت وTX رفع الإنترنت.", color = Muted, fontSize = 10.sp, modifier = Modifier.padding(top = 8.dp))
                                  }
                              }
                          }
                          item {
                              Text("إحصائيات الراوتر", color = Color.White, fontSize = 21.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(8.dp))
                              Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      StatTile("النشطون ACTIVE", totalActive.toString(), "●", Color(0xFF55B86A), Modifier.weight(1f))
                                      StatTile("الراوترات", routers.size.toString(), "▣", Color(0xFFFFA21A), Modifier.weight(1f))
                                  }
                                  Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                      StatTile("أجهزة HOST", totalHosts.toString(), "⌁", Color(0xFF39A9F5), Modifier.weight(1f))
                                      StatTile("جلسات الهوتسبوت", totalActive.toString(), "◷", Color(0xFF7665F5), Modifier.weight(1f))
                                  }
                              }
                              Text("HOST يعرض الأجهزة التي يتعرف عليها Hotspot في الميكروتك.", color = Muted, fontSize = 10.sp, modifier = Modifier.padding(top = 6.dp))
                          }
                          item {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("سجل الراوتر", color = Color.White, fontSize = 21.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.weight(1f))
                                  Text(message, color = Muted, fontSize = 10.sp)
                              }
                          }
                          if (routers.isEmpty()) {
                              item {
                                  Surface(color = Color(0xFF182341), shape = RoundedCornerShape(20.dp), modifier = Modifier.fillMaxWidth()) {
                                      Column(Modifier.padding(25.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                          Icon(Icons.Default.Router, null, tint = Color(0xFF7665F5), modifier = Modifier.size(40.dp))
                                          Text("لا توجد راوترات مضافة", color = Color.White, fontWeight = FontWeight.Bold)
                                          Text("اضغط + لإضافة الراوتر الرئيسي", color = Muted, fontSize = 12.sp)
                                      }
                                  }
                              }
                          }
                          items(routers) { router ->
                              Surface(color = Color(0xFF182341), shape = RoundedCornerShape(20.dp), modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(14.dp)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Icon(Icons.Default.Router, null, tint = Color(0xFF7665F5), modifier = Modifier.size(30.dp))
                                          Column(Modifier.weight(1f).padding(start = 10.dp)) {
                                              Text(router.name, color = Color.White, fontWeight = FontWeight.Bold)
                                              Text("${router.host}:${router.port}", color = Muted, fontSize = 11.sp)
                                          }
                                          Text("● " + router.status, color = if (router.status == "متصل") Color(0xFF55C978) else Color(0xFFFFB45B), fontSize = 11.sp)
                                      }
                                      Spacer(Modifier.height(10.dp))
                                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                          InfoChip("CPU", router.cpu); InfoChip("RAM", router.memory); InfoChip("ACTIVE", router.activeUsers)
                                      }
                                      Text("هوية الراوتر: ${router.identity}  •  مدة التشغيل: ${router.uptime}", color = Muted, fontSize = 10.sp, modifier = Modifier.padding(top = 7.dp))
                                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                                          OutlinedButton(onClick = {
                                              scope.launch {
                                                  usersLoading = true
                                                  val result = withContext(Dispatchers.IO) { runCatching {
                                                      val api = RouterOsApiClient()
                                                      api.readActiveUsers(router.host, router.port.toInt(), router.username, router.password) to
                                                          api.readHosts(router.host, router.port.toInt(), router.username, router.password)
                                                  } }
                                                  result.onSuccess { pair ->
                                                      router.activeSessions = pair.first
                                                      router.hostEntries = pair.second
                                                      selectedRouter = router
                                                      message = "ACTIVE: ${pair.first.size} • HOST: ${pair.second.size}"
                                                  }.onFailure { message = it.message ?: "تعذر تحميل الأجهزة" }
                                                  usersLoading = false
                                              }
                                          }, enabled = !usersLoading, modifier = Modifier.weight(1f)) {
                                              Icon(Icons.Default.Refresh, contentDescription = null)
                                              Text("ACTIVE")
                                          }
                                          OutlinedButton(onClick = {
                                              scope.launch {
                                                  usersLoading = true
                                                  val result = withContext(Dispatchers.IO) { runCatching { RouterOsApiClient().readHosts(router.host, router.port.toInt(), router.username, router.password) } }
                                                  result.onSuccess { router.hostEntries = it; selectedRouter = router; message = "تم تحميل ${it.size} جهاز HOST" }
                                                      .onFailure { message = it.message ?: "تعذر تحميل HOST" }
                                                  usersLoading = false
                                              }
                                          }, enabled = !usersLoading, modifier = Modifier.weight(1f)) {
                                              Icon(Icons.Default.Router, contentDescription = null)
                                              Text("الأجهزة HOST")
                                          }
                                      }
                                      if (router.lastError.isNotBlank()) Text(router.lastError, color = Color(0xFFFF9999), fontSize = 10.sp)
                                  }
                              }
                          }
                          item {
                              OutlinedButton(onClick = { showOpenWrt = true }, modifier = Modifier.fillMaxWidth()) {
                                  Text("فحص أجهزة OpenWrt")
                              }
                          }
                      }
                  }
                  if (showOpenWrt) OpenWrtDialog(context, { showOpenWrt = false })
                  if (showSettings) AlertDialog(onDismissRequest = { showSettings = false }, title = { Text("إعدادات التطبيق") }, text = {
                      Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {
                          Text("البرق نت — وضع مراقبة وقراءة فقط", color = Color.White)
                          Text("التحديث المباشر: ${if(liveSync) "مفعّل كل 3 ثوانٍ" else "متوقف"}", color = Muted)
                          Text("عدد الراوترات المحفوظة: ${routers.size}", color = Muted)
                          Text("واجهة قياس حركة البيانات: ether1", color = Muted)
                          Text("لا يقوم التطبيق بتغيير أي إعداد في الراوتر.", color = Color(0xFF55C978))
                      }
                  }, confirmButton = { TextButton(onClick = { liveSync = !liveSync }) { Text(if(liveSync) "إيقاف المباشر" else "تشغيل المباشر") } }, dismissButton = { TextButton(onClick = { showSettings = false }) { Text("إغلاق") } })
                  if (showReports) AlertDialog(onDismissRequest = { showReports = false }, title = { Text("تقارير الحالة الحالية") }, text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text("الراوترات المتصلة: $onlineRouters / ${routers.size}")
                          Text("مستخدمو ACTIVE: $totalActive")
                          Text("أجهزة HOST: $totalHosts")
                          routers.forEach { r -> Text("${r.name}: CPU ${r.cpu} • RAM ${r.memory} • تخزين ${r.storage}", color = Muted, fontSize = 12.sp) }
                          Text("هذه قراءة لحظية وليست تقريراً تاريخياً.", color = Cyan, fontSize = 11.sp)
                      }
                  }, confirmButton = { TextButton(onClick = { showReports = false }) { Text("إغلاق") } })
                  if (showRouters) AlertDialog(onDismissRequest = { showRouters = false }, title = { Text("الراوترات المحفوظة") }, text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          if (routers.isEmpty()) Text("لم تتم إضافة أي راوتر بعد.")
                          routers.forEach { r -> Text("${r.name} • ${r.host} • ${r.status}", color = Color.White) }
                          Text("إضافة راوتر جديد من زر +.", color = Muted, fontSize = 11.sp)
                      }
                  }, confirmButton = { TextButton(onClick = { showRouters = false }) { Text("إغلاق") } })
                  if (showAdd) AddRouterDialog(
                      onDismiss = { showAdd = false },
                      onAdd = { name, host, port, user, pass ->
                          routers.add(RouterEntry(name, host, port, user, pass))
                          storage.save(routers.toList())
                          showAdd = false
                      }
                  )
                  selectedRouter?.let { router -> ActiveUsersDialog(router, { selectedRouter = null }) }
              }
          }
          
          @Composable
          fun ResourceTile(label: String, value: String, accent: Color, modifier: Modifier = Modifier) {
              Surface(color = Color(0xFF202B4C), shape = RoundedCornerShape(18.dp), modifier = modifier) {
                  Column(Modifier.fillMaxWidth().padding(vertical = 12.dp, horizontal = 5.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(7.dp)) {
                      Text(value, color = accent, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      val percent = value.filter { it.isDigit() }.toFloatOrNull()?.coerceIn(0f, 100f)
                      if (percent != null && value.contains("%")) {
                          CircularProgressIndicator(progress = { percent / 100f }, modifier = Modifier.size(38.dp), color = accent, trackColor = accent.copy(alpha = .18f), strokeWidth = 4.dp)
                      } else {
                          CircularProgressIndicator(progress = { 0f }, modifier = Modifier.size(38.dp), color = accent.copy(alpha = .35f), trackColor = accent.copy(alpha = .18f), strokeWidth = 4.dp)
                      }
                      Text(label, color = Muted, fontSize = 11.sp)
                  }
              }
          }
          
          @Composable
          fun TrafficTile(label: String, value: String, background: Color, accent: Color, modifier: Modifier = Modifier) {
              Surface(color = background, shape = RoundedCornerShape(16.dp), modifier = modifier) {
                  Column(Modifier.padding(15.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(label, color = accent, fontSize = 14.sp)
                      Text(value, color = accent, fontSize = 21.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }
          
          @Composable
          fun StatTile(label: String, value: String, symbol: String, accent: Color, modifier: Modifier = Modifier) {
              Surface(color = Color(0xFF182341), shape = RoundedCornerShape(20.dp), modifier = modifier) {
                  Column(Modifier.fillMaxWidth().padding(15.dp), horizontalAlignment = Alignment.End) {
                      Text(symbol, color = accent, fontSize = 22.sp)
