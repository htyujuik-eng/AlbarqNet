          class RouterStorage(private val context: Context) {
              private val prefs = context.getSharedPreferences("albarq_saved_routers", Context.MODE_PRIVATE)
              private val alias = "AlbarqNetRouterStorageKey"
          
              private fun key(): SecretKey {
                  val store = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  (store.getKey(alias, null) as? SecretKey)?.let { return it }
                  val generator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  generator.init(
                      KeyGenParameterSpec.Builder(alias, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setRandomizedEncryptionRequired(true)
                          .build()
                  )
                  return generator.generateKey()
              }
          
              fun save(routers: List<RouterEntry>) {
                  val raw = routers.joinToString("\n") { router ->
                      listOf(router.name, router.host, router.port, router.username, router.password)
                          .joinToString("|") { Base64.encodeToString(it.toByteArray(Charsets.UTF_8), Base64.NO_WRAP) }
                  }.toByteArray(Charsets.UTF_8)
                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.ENCRYPT_MODE, key())
                  val encrypted = cipher.doFinal(raw)
                  val payload = cipher.iv + encrypted
                  prefs.edit().putString("routers", Base64.encodeToString(payload, Base64.NO_WRAP)).apply()
              }
          
              fun load(): List<RouterEntry> {
                  val encoded = prefs.getString("routers", null) ?: return emptyList()
                  return runCatching {
                      val payload = Base64.decode(encoded, Base64.NO_WRAP)
                      val iv = payload.copyOfRange(0, 12)
                      val ciphertext = payload.copyOfRange(12, payload.size)
                      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                      cipher.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, iv))
                      String(cipher.doFinal(ciphertext), Charsets.UTF_8).lineSequence()
                          .filter { it.isNotBlank() }
                          .mapNotNull { line ->
                              val fields = line.split("|").map { String(Base64.decode(it, Base64.NO_WRAP), Charsets.UTF_8) }
                              if (fields.size == 5) RouterEntry(fields[0], fields[1], fields[2], fields[3], fields[4]) else null
                          }.toList()
                  }.getOrDefault(emptyList())
              }
          }
          
          class RouterOsApiClient {
              private fun <T> withApi(host: String, port: Int, username: String, password: String, action: ((List<String>) -> List<List<String>>) -> T): T {
                  require(port in 1..65535) { "رقم المنفذ غير صحيح" }
                  Socket().use { socket ->
                      socket.connect(InetSocketAddress(host, port), 9000)
                      socket.soTimeout = 9000
                      val input = BufferedInputStream(socket.getInputStream())
                      val output = BufferedOutputStream(socket.getOutputStream())
                      fun command(words: List<String>): List<List<String>> {
                          words.forEach { word ->
                              val bytes = word.toByteArray(Charsets.UTF_8)
                              writeLength(output, bytes.size); output.write(bytes)
                          }
                          output.write(0); output.flush()
                          val rows = mutableListOf<List<String>>()
                          while (true) {
                              val sentence = mutableListOf<String>()
                              while (true) {
                                  val length = readLength(input)
                                  if (length == 0) break
                                  val bytes = ByteArray(length); var offset = 0
                                  while (offset < length) {
                                      val count = input.read(bytes, offset, length - offset)
                                      if (count < 0) throw IllegalStateException("انقطع اتصال API")
                                      offset += count
                                  }
                                  sentence.add(String(bytes, Charsets.UTF_8))
                              }
                              if (sentence.isEmpty()) continue
                              when (sentence[0]) {
                                  "!re" -> rows.add(sentence)
                                  "!trap" -> throw IllegalStateException(sentence.drop(1).joinToString(" ").ifBlank { "رفض المايكروتك الأمر" })
                                  "!fatal" -> throw IllegalStateException("أغلق المايكروتك اتصال API")
                                  "!done" -> return rows
                              }
                          }
                      }
                      command(listOf("/login", "=name=$username", "=password=$password"))
                      return action { words -> command(words) }
                  }
              }
          
              fun readStatus(host: String, port: Int, username: String, password: String): Map<String, String> =
                  withApi(host, port, username, password) { command ->
                      val resources = command(listOf("/system/resource/print")).firstOrNull().orEmpty()
                      val identity = command(listOf("/system/identity/print")).firstOrNull().orEmpty()
                      val active = command(listOf("/ip/hotspot/active/print"))
                      fun value(row: List<String>, key: String) = row.firstOrNull { it.startsWith("=$key=") }?.substringAfter("=$key=") ?: "—"
                      val total = value(resources, "total-memory").toLongOrNull()
                      val free = value(resources, "free-memory").toLongOrNull()
                      val memory = if (total != null && free != null && total > 0) "${(total - free) * 100 / total}%" else "—"
                      val diskTotal = value(resources, "total-hdd-space").toLongOrNull()
                      val diskFree = value(resources, "free-hdd-space").toLongOrNull()
                      val storage = if (diskTotal != null && diskFree != null && diskTotal > 0) "${((diskTotal-diskFree)*100/diskTotal)}%" else "غير مدعوم"
                      mapOf("identity" to value(identity, "name"), "cpu" to value(resources, "cpu-load").let { if (it == "—") it else "$it%" },
                          "memory" to memory, "storage" to storage, "uptime" to value(resources, "uptime"), "active" to active.size.toString())
                  }
          
              fun readHosts(host:String,port:Int,username:String,password:String):List<HotspotHost> =
                  withApi(host,port,username,password) { command ->
                      val leases = runCatching { command(listOf("/ip/dhcp-server/lease/print")) }.getOrDefault(emptyList())
                      val namesByMac = leases.mapNotNull { lease ->
                          fun field(key:String)=lease.firstOrNull{it.startsWith("=$key=")}?.substringAfter("=$key=") ?: ""
                          val mac=field("mac-address").lowercase()
                          val name=field("host-name").ifBlank { field("comment") }
                          if(mac.isNotBlank() && name.isNotBlank()) mac to name else null
                      }.toMap()
                      command(listOf("/ip/hotspot/host/print")).map { row ->
                          fun field(key:String)=row.firstOrNull{it.startsWith("=$key=")}?.substringAfter("=$key=") ?: ""
                          val mac=field("mac-address")
                          val bridgePort=field("bridge-port")
                          val deviceName=namesByMac[mac.lowercase()] ?: "غير معروف"
                          HotspotHost(field("address"),mac,field("server"),field("uptime"),bridgePort.ifBlank{"—"},deviceName)
                      }.filter{it.address.isNotBlank() || it.mac.isNotBlank()}
                  }
          
              fun readTraffic(host:String,port:Int,username:String,password:String):Map<String,String> =
                  withApi(host,port,username,password) { command ->
                      val row = command(listOf("/interface/monitor-traffic","=interface=ether1","=once=")).firstOrNull()
                          ?: throw IllegalStateException("لم تصل قراءة حركة ether1")
                      fun rate(key:String):Long = row.firstOrNull{it.startsWith("=$key=")}?.substringAfter("=$key=")?.toLongOrNull() ?: 0L
                      fun format(bits:Long):String = when {
                          bits >= 1_000_000 -> String.format(java.util.Locale.US,"%.2f Mbps",bits/1_000_000.0)
                          bits >= 1_000 -> String.format(java.util.Locale.US,"%.1f Kbps",bits/1_000.0)
                          else -> "$bits bps"
                      }
                      mapOf("upload" to format(rate("tx-bits-per-second")),
                          "download" to format(rate("rx-bits-per-second")))
                  }
          
              fun readActiveUsers(host: String, port: Int, username: String, password: String): List<ActiveHotspotUser> =
                  withApi(host, port, username, password) { command ->
                      command(listOf("/ip/hotspot/active/print")).map { row ->
                          fun field(key: String) = row.firstOrNull { it.startsWith("=$key=") }?.substringAfter("=$key=") ?: ""
                          val id = row.firstOrNull { it.startsWith(".id=") }?.substringAfter(".id=") ?: ""
                          ActiveHotspotUser(id, field("user"), field("address"), field("mac-address"), field("uptime"))
                      }.filter { it.id.isNotBlank() }
                  }
          
          
          
              private fun writeLength(out: BufferedOutputStream, length: Int) {
                  when {
                      length < 0x80 -> out.write(length)
                      length < 0x4000 -> { out.write((length shr 8) or 0x80); out.write(length and 0xff) }
                      length < 0x200000 -> { out.write((length shr 16) or 0xC0); out.write((length shr 8) and 0xff); out.write(length and 0xff) }
                      length < 0x10000000 -> { out.write((length shr 24) or 0xE0); out.write((length shr 16) and 0xff); out.write((length shr 8) and 0xff); out.write(length and 0xff) }
                      else -> { out.write(0xF0); out.write((length shr 24) and 0xff); out.write((length shr 16) and 0xff); out.write((length shr 8) and 0xff); out.write(length and 0xff) }
                  }
              }
              private fun readLength(input: BufferedInputStream): Int {
                  val b=input.read(); if(b<0) throw IllegalStateException("انتهى اتصال الراوتر")
                  return when {
                      (b and 0x80)==0 -> b
                      (b and 0xC0)==0x80 -> ((b and 0x3f) shl 8) or readByte(input)
                      (b and 0xE0)==0xC0 -> ((b and 0x1f) shl 16) or (readByte(input) shl 8) or readByte(input)
                      (b and 0xF0)==0xE0 -> ((b and 0x0f) shl 24) or (readByte(input) shl 16) or (readByte(input) shl 8) or readByte(input)
                      else -> (readByte(input) shl 24) or (readByte(input) shl 16) or (readByte(input) shl 8) or readByte(input)
                  }
              }
              private fun readByte(input: BufferedInputStream): Int {
                  val v=input.read(); if(v<0) throw IllegalStateException("انتهى اتصال الراوتر"); return v
              }
          }
          
          
          data class OpenWrtClient(val mac:String,val ip:String,val name:String,val deviceType:String="غير محدد")
          data class OpenWrtDevice(val ip:String,val state:String,val host:String="—",val model:String="—",val clients:String="غير متاح",val clientDetails:List<OpenWrtClient> = emptyList())
          class OpenWrtPasswordStore(c:Context) {
              private val prefs=c.getSharedPreferences("albarq_openwrt",Context.MODE_PRIVATE)
              private val alias="AlbarqOpenWrtKey"
              private fun secret():SecretKey {
                  val ks=KeyStore.getInstance("AndroidKeyStore").apply{load(null)}
                  (ks.getKey(alias,null) as? SecretKey)?.let{return it}
                  val g=KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore")
                  g.init(KeyGenParameterSpec.Builder(alias,KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT).setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).build())
                  return g.generateKey()
              }
              fun save(v:String){val c=Cipher.getInstance("AES/GCM/NoPadding");c.init(Cipher.ENCRYPT_MODE,secret());prefs.edit().putString("pw",Base64.encodeToString(c.iv+c.doFinal(v.toByteArray()),Base64.NO_WRAP)).apply()}
              fun load():String=runCatching{val b=Base64.decode(prefs.getString("pw",""),Base64.NO_WRAP);val c=Cipher.getInstance("AES/GCM/NoPadding");c.init(Cipher.DECRYPT_MODE,secret(),GCMParameterSpec(128,b.copyOfRange(0,12)));String(c.doFinal(b.copyOfRange(12,b.size)))}.getOrDefault("")
          }
          private fun openWrtSsh(ip:String,pw:String,cmd:String):String {
              val session=JSch().getSession("root",ip,22);session.setPassword(pw)
              val cfg=Properties();cfg.put("StrictHostKeyChecking","no");session.setConfig(cfg);session.connect(2200)
              try {val ch=session.openChannel("exec") as ChannelExec;ch.setCommand(cmd);ch.setInputStream(null);val out=java.io.ByteArrayOutputStream();ch.outputStream=out;ch.connect(2200)
                  val end=System.currentTimeMillis()+2200;while(!ch.isClosed && System.currentTimeMillis()<end) Thread.sleep(50)
                  val result=out.toString("UTF-8").trim();ch.disconnect();return result
              } finally {session.disconnect()}
          }
          private fun scanOpenWrt(pw:String):List<OpenWrtDevice> {
              val list=mutableListOf<OpenWrtDevice>()
              for(n in 10..35) {
                  val ip="10.0.0."+n
                  try {
                      val host=openWrtSsh(ip,pw,"cat /proc/sys/kernel/hostname").ifBlank{"OpenWrt"}
                      val model=openWrtSsh(ip,pw,"cat /tmp/sysinfo/model 2>/dev/null || cat /tmp/sysinfo/board_name").ifBlank{"غير معروف"}
                      val clientsCmd = "iw dev | awk '/Interface/{print \$2}' | while read iface; do iw dev \$iface station dump 2>/dev/null | awk '/^Station /{print \$2}'; done | sort -u | while read clientmac; do [ -n \$clientmac ] || continue; clientip=\$(ip neigh show | awk -v m=\$clientmac 'tolower(\$5)==tolower(m){print \$1;exit}'); clientname=\$(awk -v m=\$clientmac 'tolower(\$2)==tolower(m){print \$4;exit}' /tmp/dhcp.leases 2>/dev/null); printf '%s|%s|%s\\n' \$clientmac \"\$clientip\" \"\$clientname\"; done"
                      val clientRaw=runCatching{openWrtSsh(ip,pw,clientsCmd)}.getOrDefault("")
                      val clientList=clientRaw.lines().mapNotNull { line ->
                          val parts=line.split("|")
                          if(parts.size>=3 && parts[0].matches(Regex("(?i)([0-9a-f]{2}:){5}[0-9a-f]{2}"))) OpenWrtClient(parts[0],parts[1],parts[2]) else null
                      }.distinctBy{it.mac}
                      val count=clientList.size.toString()
                      list.add(OpenWrtDevice(ip,"دخول ناجح",host.lines().first(),model.lines().first(),count,clientList))
                  } catch(e:Exception) {
                      val reachable=runCatching{Socket().use{it.connect(InetSocketAddress(ip,22),500)};true}.getOrDefault(false)
                      if(reachable) list.add(OpenWrtDevice(ip,"SSH متاح؛ تعذر تسجيل الدخول"))
                  }
              }
              return list
          }
